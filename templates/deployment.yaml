{{- $root := . }}

{{- range $name, $service := .Values.microservices }}

{{- if $service.enabled }}

apiVersion: apps/v1
kind: Deployment 

metadata:
  name: {{ include "microservices.serviceFullname" (dict "root" $root "name" $name) }}
  labels:
    {{- include "microservices.serviceLabels" (dict "root" $root "name" $name) | nindent 4 }}

spec:
  replicas: {{ $service.replicaCount }}
  
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
    
  template:
    metadata:
      labels:
        {{- include "microservices.serviceLabels" (dict "root" $root "name" $name) | nindent 8 }}
      
    spec:
      
      terminationGracePeriodSeconds: {{ $root.Values.global.terminationGracePeriodSeconds }}
      {{- if $service.serviceAccount.create }}
      serviceAccountName:  {{ include "microservices.serviceFullname" (dict "root" $root "name" $name) }}
      automountServiceAccountToken: {{ $service.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      securityContext:
        {{- toYaml $service.podSecurityContext | nindent 10 }}
      
      {{- with $service.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $service.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $service.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $service.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ $service.topologySpread.maxSkew }}
          topologyKey: {{ $service.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ $service.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
              app.kubernetes.io/instance: {{ $root.Release.Name }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $service.image.repository }}:{{ $service.image.tag }}"
          securityContext:
            {{- toYaml $service.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $service.containerPort }}
              protocol: TCP
          
          resources:
            {{ toYaml $service.resources | nindent 14 }}
          {{- if or $service.config $service.secrets.enabled }}
          envFrom:
            {{- if $service.config }}
            - configMapRef:
                name: {{ include "microservices.serviceFullname" (dict "root" $root "name" $name) }}-config
            {{- end }}

            {{- if and $service.secrets.enabled $service.secrets.existingSecret }}
            - secretRef:
                name: {{ $service.secrets.existingSecret }}
            {{- end }}
          {{- end }}
          {{- if $service.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ $service.probes.startup.path }}
              port: {{ $service.probes.startup.port }}
            initialDelaySeconds: {{ $service.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ $service.probes.startup.periodSeconds }}
            timeoutSeconds: {{ $service.probes.startup.timeoutSeconds }}
            failureThreshold: {{ $service.probes.startup.failureThreshold }}
            successThreshold: {{ $service.probes.startup.successThreshold }}
          {{- end }}
          {{- if $service.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ $service.probes.readiness.path }}
              port: {{ $service.probes.readiness.port }}
            initialDelaySeconds: {{ $service.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $service.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $service.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $service.probes.readiness.failureThreshold }}
            successThreshold: {{ $service.probes.readiness.successThreshold }}
          {{- end }}
          {{- if $service.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ $service.probes.liveness.path }}
              port: {{ $service.probes.liveness.port }}
            initialDelaySeconds: {{ $service.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $service.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $service.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $service.probes.liveness.failureThreshold }}
            successThreshold: {{ $service.probes.liveness.successThreshold }}
          {{- end }}
---
{{- end }}
{{- end }}