{{- if .Values.ingress.enabled }}

{{- $root := . }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "microservices.fullname" $root }}
  labels:
    {{- include "microservices.labels" $root | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}

spec:
  ingressClassName: {{ .Values.ingress.className | quote }}

  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "microservices.serviceFullname" (dict "root" $root "name" .service.name) }}
                port:
                  number: {{ .service.port }}
          {{- end }}   
    {{- end }}
  {{- if $root.Values.ingress.tls }}
  tls:
    {{- toYaml $root.Values.ingress.tls | nindent 4 }}
  {{- end }}
  
{{- end }}