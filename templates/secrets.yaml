{{- range $name, $service := .Values.microservices }}

{{- if $service.secrets.enabled }}
apiVersion: v1 
kind: Secret
metadata: 
  name: {{ $name }}-secret
  labels:
    app.kubernetes.io/name: {{ $name }}
type: Opaque
data: 
  {{- range $key, $val := $service.secrets }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
---
{{- end }}

{{- end }} 