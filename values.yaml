# This values.yaml will be used to configure the microservices in the Helm chart. You can customize the image, replica count, and port for each microservice as needed.
global:
  # Common application identity 
  partOf: microservices

  image:
    pullPolicy: IfNotPresent

  #default deployment settings
  terminationGracePeriodSeconds: 30

microservices:

  analytics:
     enabled: true
     
     image:
       repository: analytics-service
       tag: "dev"
       pullPolicy: IfNotPresent
     
     replicaCount: 2

     containerPort: 5006

     service:
       type: ClusterIP
       port: 5006
       targetPort: http
       
     resources:
       requests:
         cpu: 200m
         memory: 256Mi
       limits:
         cpu: 1000m
         memory: 1Gi
     
     autoscaling:
       enabled: true

       minReplicas: 2
       maxReplicas: 10
       
       targetCPUUtilizationPercentage: 70
       targetMemoryUtilizationPercentage: 80
     
     config: {}

     secrets:
       enabled: false
       existingSecret: ""

     probes:
        
        startup:
          enabled: true
          path: /health
          port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 30
          successThreshold: 1

        readiness:
          enabled: true
          path: /health
          port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1

        liveness:
          enabled: true
          path: /health
          port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1
     
     podSecurityContext:
       runAsNonRoot: true

       seccompProfile:
         type: RuntimeDefault
     
     securityContext:
       allowPrivilegeEscalation: false
       readOnlyRootFilesystem: true

       capabilities:
         drop:
           - ALL
     
     serviceAccount:
       create: true
       automountServiceAccountToken: false
       annotations: {}
     
     networkPolicy:
       enabled: true

       ingress:
         fromServices:
           - gateway

       fromIngressController: false
       
       egress: 
         toServices:
           - task 

       allowDNS: true

     podDisruptionBudget:
       enabled: true
       minAvailable: 1
     
     deployment:
       strategy:
         
         type: RollingUpdate
         rollingUpdate: 
           maxUnavailable: 0
           maxSurge: 1

       revisionHistoryLimit: 5
       progressDeadlineSeconds: 600
       minReadySeconds: 5

     nodeSelector: {}

     tolerations: []
     
     affinity: {}
     
     topologySpread:
       enabled: true
       maxSkew: 1
       topologyKey: kubernetes.io/hostname
       whenUnsatisfiable: DoNotSchedule
       
  auth:
    enabled: true


    image: 
      repository: auth-service
      tag: latest
      pullPolicy: IfNotPresent

    replicaCount: 2

    containerPort: 5001

    service:
      type: ClusterIP
      port: 5001 
      targetPort: http

    resources:
      requests:
        cpu: 150m
        memory: 128Mi
      limits:
        cpu: 750m
        memory: 512Mi

    autoscaling:
      enabled: true

      minReplicas: 2
      maxReplicas: 8
      
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

    probes:
      
      startup:
        enabled: true
        path: /health
        port: http
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 30
        successThreshold: 1

      readiness:
        enabled: true
        path: /health
        port: http
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
        successThreshold: 1

      liveness:
        enabled: true
        path: /health
        port: http
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
        successThreshold: 1
      # Before production we will need to verify the paths 

    config:
      Log_Level: "info"
      ENVIRONMENT: "production"

    secrets:
       enabled: false
       existingSecret: "" 
     # For the secrets the approach will be following rather than hardcoding them in the values.yaml file. We will use AWS Secrets Manager to manage sensitive information. The flow will be as follows:
                # AWS Secrets Manager
                #       ↓
                # ExternalSecret
                #       ↓
                # Kubernetes Secret
                #       ↓
                # Pod
    
    podSecurityContext:
      runAsNonRoot: true

      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      
      readOnlyRootFilesystem: true
      
      capabilities:
        drop:
          - ALL

    serviceAccount:
      create: true
      
      automountServiceAccountToken: false
      annotations: {}
    
    networkPolicy:
      enabled: true
      
      ingress: 
        fromServices:
          - gateway

      fromIngressController: false
      
      egress:
        toServices:
          - user

      allowDNS: true 

    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    
    deployment:
       strategy:
         
         type: RollingUpdate
         rollingUpdate: 
           maxUnavailable: 0
           maxSurge: 1

       revisionHistoryLimit: 5
       progressDeadlineSeconds: 600
       minReadySeconds: 5

    affinity: {}
    
    nodeSelector: {}

    tolerations: []

    topologySpread:
      enabled: true
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule

