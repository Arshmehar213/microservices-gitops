# ! Ingress Values !
ingress:
  enabled: true

  className: alb

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
          service:
            name: gateway
            port: 5000
  
  # TODO: Add TLS/ACM certificate configuration when AWS infrastructure is configured.
  tls:
    - secretName: example.com.tls # Replaced this with the actual values
      hosts: 
        - ://example.com
        - ://example.com

# ---- Autoscaling (It needs to be metrics server enabled in the cluster) ----